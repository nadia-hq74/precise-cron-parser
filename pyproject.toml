[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronspec"
version = "0.1.0"
description = "Cron expression parser with precise, human-readable error messages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nadia-hq74" }]

[tool.setuptools.packages.find]
include = ["cronspec*"]
